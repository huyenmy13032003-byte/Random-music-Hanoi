<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Music - Chapter 1 Hanoi</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #121212, #1e1e2f);
      color: #ffffff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      padding: 32px 24px;
      border-radius: 20px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    p {
      margin: 0 0 24px;
      font-size: 14px;
      color: #bbbbbb;
    }
    .btn-play {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: #1db954;
      color: white;
      font-size: 32px;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.15s ease, background 0.2s;
    }
    .btn-play:active {
      transform: scale(0.94);
    }
    .btn-play:disabled {
      background: #555;
      cursor: wait;
    }
    .btn-next {
      margin-top: 20px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }
    /* Ẩn video YouTube nhưng vẫn giữ âm thanh hoạt động trên điện thoại */
    #yt-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }
    #drive-player {
      display: none;
      width: 100%;
      height: 80px;
      border: none;
      border-radius: 12px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Chapter 1 Hanoi</h2>
    <p id="status">Đang tải giai điệu ngẫu nhiên...</p>

    <!-- Trình phát cho nhạc YouTube (chỉ hiện nút Play) -->
    <div id="yt-controls">
      <button id="playBtn" class="btn-play" disabled>▶</button>
    </div>

    <!-- Trình phát gọn cho file Google Drive -->
    <iframe id="drive-player" allow="autoplay"></iframe>

    <div>
      <button class="btn-next" onclick="location.reload()">↻ Đổi bài ngẫu nhiên khác</button>
    </div>
  </div>

  <!-- Khung YouTube ẩn -->
  <div id="yt-hidden">
    <div id="player"></div>
  </div>
