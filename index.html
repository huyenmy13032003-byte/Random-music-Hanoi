<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Music - Chapter 1 Hanoi</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #121212, #1e1e2f);
      color: #ffffff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      padding: 32px 24px;
      border-radius: 20px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    p {
      margin: 0 0 24px;
      font-size: 14px;
      color: #bbbbbb;
    }
    .btn-play {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: #1db954;
      color: white;
      font-size: 32px;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.15s ease, background 0.2s;
    }
    .btn-play:active {
      transform: scale(0.94);
    }
    .btn-play:disabled {
      background: #555;
      cursor: wait;
    }
    .btn-next {
      margin-top: 20px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }
    #yt-hidden {
      position: fixed;
      top: 0;
      left: -9999px;
      width: 250px;
      height: 250px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Chapter 1 Hanoi</h2>
    <p id="status">Đang tải giai điệu ngẫu nhiên...</p>

    <div id="controls">
      <button id="playBtn" class="btn-play" disabled>▶</button>
    </div>

    <div>
      <button class="btn-next" onclick="location.reload()">↻ Đổi bài ngẫu nhiên khác</button>
    </div>
  </div>

  <!-- Khung YouTube ẩn -->
  <div id="yt-hidden">
    <div id="player"></div>
  </div>

  <!-- Trình phát chỉ âm thanh cho Google Drive -->
  <audio id="drive-audio" preload="auto"></audio>

  <script>
    const danhSachNhac = [
      { type: "youtube", id: "jniKmPHQoHE", start: 60 },
      { type: "youtube", id: "wwzjoewz73s", start: 27 },
      { type: "youtube", id: "o1uWwjoYntM", start: 27 },
      { type: "youtube", id: "JVKkuRw9Ges", start: 76 },
      { type: "drive",   id: "1O_PvBOgZfP-DzeUl7aekHUOW3K2Y-9_V" },
      { type: "drive",   id: "1LVK0hmZNfRgPdj5sgye_lLrMvs2i0R6C" },
      { type: "youtube", id: "JqCcml9QvIQ", start: 46 }
    ];

    const baiHat = danhSachNhac[Math.floor(Math.random() * danhSachNhac.length)];
    const statusEl = document.getElementById("status");
    const playBtn = document.getElementById("playBtn");
    const driveAudio = document.getElementById("drive-audio");

    let player;
    let isPlaying = false;

    if (baiHat.type === "drive") {
      driveAudio.src = `https://docs.google.com/uc?export=download&id=${baiHat.id}`;
      playBtn.disabled = false;
      statusEl.textContent = "Bấm nút xanh bên dưới để nghe nhạc";

      driveAudio.addEventListener("playing", () => {
        isPlaying = true;
        playBtn.textContent = "⏸";
        statusEl.textContent = "Đang phát nhạc...";
      });
      driveAudio.addEventListener("pause", () => {
        isPlaying = false;
        playBtn.textContent = "▶";
        statusEl.textContent = "Đã tạm dừng";
      });
      driveAudio.addEventListener("ended", () => {
        isPlaying = false;
        playBtn.textContent = "▶";
        statusEl.textContent = "Đã phát xong";
      });
      driveAudio.addEventListener("error", () => {
        statusEl.textContent = "File Drive không hỗ trợ phát trực tiếp, đang đổi bài...";
        setTimeout(() => location.reload(), 800);
      });
    } else {
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("player", {
        height: "250",
        width: "250",
        videoId: baiHat.id,
        playerVars: {
          start: baiHat.start || 0,
          playsinline: 1,
          origin: window.location.origin
        },
        events: {
          onReady: () => {
            playBtn.disabled = false;
            statusEl.textContent = "Bấm nút xanh bên dưới để nghe nhạc";
          },
          onError: () => {
            statusEl.textContent = "Bài này bị hạn chế, đang đổi bài khác...";
            setTimeout(() => location.reload(), 800);
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.PLAYING) {
              isPlaying = true;
              playBtn.textContent = "⏸";
              statusEl.textContent = "Đang phát nhạc...";
            } else if (event.data === YT.PlayerState.PAUSED) {
              isPlaying = false;
              playBtn.textContent = "▶";
              statusEl.textContent = "Đã tạm dừng";
            } else if (event.data === YT.PlayerState.ENDED) {
              isPlaying = false;
              playBtn.textContent = "▶";
              statusEl.textContent = "Đã phát xong";
            }
          }
        }
      });
    };

    playBtn.addEventListener("click", () => {
      if (baiHat.type === "drive") {
        if (isPlaying) {
          driveAudio.pause();
        } else {
          statusEl.textContent = "Đang tải âm thanh...";
          driveAudio.play().catch(() => {
            statusEl.textContent = "File Drive bị chặn phát trực tiếp, đang đổi bài...";
            setTimeout(() => location.reload(), 800);
          });
        }
      } else if (player) {
        if (isPlaying) {
          player.pauseVideo();
        } else {
          player.playVideo();
        }
      }
    });
  </script>
</body>
</html>
