<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Music - Chapter 1 Hanoi</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #121212, #1e1e2f);
      color: #ffffff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      padding: 28px 22px;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }
    .card.secret-card {
      background: linear-gradient(145deg, rgba(120, 18, 18, 0.85), rgba(40, 12, 12, 0.92));
      border: 1.5px solid #f5c542;
      box-shadow: 0 0 28px rgba(245, 197, 66, 0.28);
    }
    h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    p {
      margin: 0 0 18px;
      font-size: 14px;
      color: #bbbbbb;
    }
    #secret-banner {
      display: none;
      margin: 0 0 20px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(245, 197, 66, 0.12);
      border: 1px solid rgba(245, 197, 66, 0.45);
      text-align: left;
      font-size: 13px;
      line-height: 1.55;
      color: #fff4d2;
    }
    #secret-banner .secret-badge {
      display: inline-block;
      margin-bottom: 8px;
      padding: 3px 10px;
      border-radius: 999px;
      background: #f5c542;
      color: #3a0c0c;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    #secret-banner p {
      margin: 0 0 8px;
      font-size: 13px;
      color: #fff4d2;
    }
    #secret-banner p:last-child {
      margin-bottom: 0;
    }
    .btn-play {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: #1db954;
      color: white;
      font-size: 32px;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.15s ease, background 0.2s;
    }
    .secret-card .btn-play {
      background: #d9a426;
      color: #2b0909;
    }
    .btn-play:active {
      transform: scale(0.94);
    }
    .btn-play:disabled {
      background: #555;
      color: #fff;
      cursor: wait;
    }
    #tiktok-box {
      display: none;
      margin: 0 0 16px;
    }
    #tiktok-frame {
      display: none;
      width: 100%;
      height: 460px;
      border: none;
      border-radius: 14px;
      background: #000;
    }
    .btn-tiktok {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 999px;
      background: #fe2c55;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      box-shadow: 0 6px 18px rgba(254, 44, 85, 0.35);
    }
    .btn-next {
      margin-top: 18px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }
    .reroll-info {
      margin-top: 8px;
      margin-bottom: 0;
      font-size: 12px;
      color: #999999;
    }
    #coffee-notice {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px dashed rgba(255, 255, 255, 0.25);
      text-align: left;
      font-size: 13px;
      line-height: 1.55;
      color: #e6d5c3;
    }
    #coffee-notice p {
      margin: 0 0 10px;
      font-size: 13px;
      color: #e6d5c3;
    }
    #coffee-notice p:last-child {
      margin-bottom: 0;
    }
    #yt-hidden {
      position: fixed;
      top: 0;
      left: -9999px;
      width: 250px;
      height: 250px;
    }
  </style>
</head>
